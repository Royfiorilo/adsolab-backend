  /kinetics/investigation/save:
    post:
      tags:
        - Cinética - Investigaciones
      summary: Guardar investigación cinética 🔒
      description: |
        Crea o actualiza una investigación cinética con una nueva versión de resultados.

        **Campos opcionales (todos con defaults):**
        - `kinetic_sample_id`: ID de la muestra (requerido)
        - `kinetic_investigation_id`: null para crear nueva, o ID existente para agregar versión
        - `results`: Array de modelos ajustados (default: [])
        - `comparison`: Objeto de comparación (default: {})
        - `iterations`: Iteraciones usadas (default: null)
        - `steps`: Tamaño de paso usado (default: null)
        
        **Flujo típico:**
        1. Ejecutar `/kinetics/run-no-linear-model` para obtener results + comparison
        2. Llamar a este endpoint con esos resultados para guardarlos
        
        **Nota:** A diferencia del módulo de equilibrio, en cinética los campos `results` y
        `comparison` son opcionales con defaults. Esto permite guardar investigaciones vacías.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KineticSaveRequest'
            example:
              kinetic_sample_id: 1
              kinetic_investigation_id: null
              iterations: 10000
              steps: 0.1
              results:
                - model: 1
                  best_adjust: "leastsq"
                  seeds:
                    - name: "kid"
                      value: 0.834
                    - name: "C"
                      value: 1.0
                  adjustment_methods: []
              comparison:
                heuristic:
                  best_model: 1
                  results: []
      responses:
        '201':
          description: Investigación guardada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  kinetic_investigation_id:
                    type: integer
                  version_id:
                    type: integer
        '401':
          description: No autenticado
        '403':
          description: No autorizado
        '404':
          description: Muestra no encontrada

  /kinetics/investigation/{kinetic_investigation_id}/versions:
    get:
      tags:
        - Cinética - Investigaciones
      summary: Listar versiones de una investigación cinética
      parameters:
        - in: path
          name: kinetic_investigation_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de versiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/KineticVersion'

  /kinetics/investigation/{kinetic_investigation_id}/version/{version_id}:
    get:
      tags:
        - Cinética - Investigaciones
      summary: Obtener versión cinética específica
      parameters:
        - in: path
          name: kinetic_investigation_id
          required: true
          schema:
            type: integer
        - in: path
          name: version_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la versión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticVersion'
        '404':
          description: Versión no encontrada

    delete:
      tags:
        - Cinética - Investigaciones
      summary: Eliminar versión cinética 🔒
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: kinetic_investigation_id
          required: true
          schema:
            type: integer
        - in: path
          name: version_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Versión eliminada correctamente
        '403':
          description: No autorizado

  /kinetics/investigation/{kinetic_investigation_id}:
    delete:
      tags:
        - Cinética - Investigaciones
      summary: Eliminar investigación cinética 🔒
      description: Elimina la investigación y todas sus versiones en cascada.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: kinetic_investigation_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Investigación eliminada correctamente
        '403':
          description: No autorizado
        '404':
          description: Investigación no encontrada

