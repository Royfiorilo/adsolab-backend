      type: object
      properties:
        durbin_watson:
          type: number
        homoscedasticity_pvalue:
          type: number
        normality_pvalue:
          type: number
        passes_homoscedasticity:
          type: boolean
        passes_independence:
          type: boolean
        passes_normality:
          type: boolean
    Statistics:
      type: object
      properties:
        AIC:
          type: number
        BIC:
          type: number
        HYBRID:
          type: number
        RMSE:
          type: number
        SSE:
          type: number
        adjust_chi_squeared:
          type: number
        adjust_r_squared:
          type: number
        chi_squared:
          type: number
        r_squared:
          type: number

    # ─────────────────────────────────────────────
    # SCHEMAS - MÓDULO CINÉTICO
    # ─────────────────────────────────────────────

    KineticModel:
      type: object
      properties:
        _id:
          type: integer
        name:
          type: string
          example: "Difusión Intraparticular"
        formula:
          type: string
          example: "qt = kid * time**0.5 + C"
        latex_formula:
          type: string
          example: "q_t = k_{id} \\cdot \\sqrt{t} + C"
        description:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
          example:
            kid: "constante de velocidad de difusión intraparticular (mg/g·min^0.5)"
            C: "intercepto relacionado con la capa límite externa (mg/g)"
        linearizations:
          type: array
          items:
            $ref: '#/components/schemas/KineticLinearization'

    KineticLinearization:
      type: object
      properties:
        linearization_id:
          type: integer
        name:
          type: string
        formula:
          type: string
        description:
          type: string
        parameters:
          type: object
          properties:
            x:
              type: string
              description: Expresión para transformar la variable independiente
              example: "time**0.5"
            y:
              type: string
              description: Expresión para transformar la variable dependiente
              example: "qt"
            m:
              type: string
              description: Parámetro del modelo asociado a la pendiente
              example: "kid"
            b:
              type: string
              description: Parámetro del modelo asociado al intercepto
              example: "C"
        latex_formula:
          type: string
        kinetic_model_id:
          type: integer

    KineticSample:
      type: object
      properties:
        kinetic_sample_id:
          type: integer
        time:
          type: array
          items:
            type: number
          example: [0, 5, 10, 20, 30, 60]
        qt:
          type: array
          items:
            type: number
          example: [0.0, 3.2, 5.1, 6.8, 7.4, 7.8]
        concentration:
          type: array
          items:
            type: number
          nullable: true
        initial_concentration:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        adsorbent_mass:
          type: number
          nullable: true
        title:
          type: string
          nullable: true
          example: "admin-298K-cinetica-arsenico-hidroxiapatita-01-06-2026"
        description:
          type: string
          nullable: true
        temperature:
          type: number
          example: 298
        time_unit:
          type: string
          example: "min"
        measure_unit:
          type: string
          example: "mg/g"
        adsorbate_id:
          type: integer
        adsorbent_id:
          type: integer
        user_id:
          type: integer

    KineticSampleInput:
      type: object
      required:
        - time
        - adsorbate_id
        - adsorbent_id
      properties:
        time:
          type: array
          items:
            type: number
          description: Instantes de tiempo (al menos 2 puntos)
          example: [0, 5, 10, 20, 30, 60]
        qt:
          type: array
          items:
            type: number
          description: Cantidad adsorbida en cada instante. Requerido si no se provee `concentration`.
          example: [0.0, 3.2, 5.1, 6.8, 7.4, 7.8]
        concentration:
          type: array
          items:
            type: number
          description: Concentración en solución en cada instante. Alternativa a `qt`.
          nullable: true
        initial_concentration:
          type: number
          description: Concentración inicial C₀ (mg/L). Requerido si se usa `concentration`.
          nullable: true
        volume:
          type: number
          description: Volumen de solución (L). Requerido si se usa `concentration`.
          nullable: true
        adsorbent_mass:
          type: number
          description: Masa de adsorbente (g). Requerido si se usa `concentration`.
          nullable: true
        temperature:
          type: number
          example: 298
        time_unit:
          type: string
          example: "min"
        measure_unit:
          type: string
          example: "mg/g"
        adsorbate_id:
          type: integer
        adsorbent_id:
          type: integer
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    KineticPredictSeedsRequest:
      type: object
      required:
        - kinetic_sample_id
        - models
      properties:
        kinetic_sample_id:
          type: integer
        models:
          type: array
          items:
            type: object
            required: [model]
            properties:
              model:
                type: integer
                description: ID del modelo cinético
        filter:
          type: array
          items:
            type: integer
          description: Índices de puntos a excluir del ajuste
          example: []

    KineticPredictSeedsResponse:
      type: object
      properties:
        kinetic_sample_id:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              seeds:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: number

    KineticRunLinearizationRequest:
      type: object
      required:
        - kinetic_sample_id
        - models
      properties:
        kinetic_sample_id:
          type: integer
        models:
          type: array
          items:
            type: object
            required: [model]
            properties:
              model:
                type: integer
              linearizations:
                type: array
                items:
                  type: integer
                description: IDs de linealizaciones a ejecutar
              known_params:
                type: object
                additionalProperties:
                  type: number
                description: >
                  Valores de los parámetros que la transformación necesita conocer de
                  antemano (e.g. `qe` para PFO). Si se omite, se estiman desde la muestra.
                example:
                  qe: 7.4
        filter:
          type: array
          items:
            type: integer
          example: []

    KineticRunLinearizationResponse:
      type: object
      properties:
        kinetic_sample_id:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              model:
                type: integer
              best_result:
                type: integer
                nullable: true
                description: ID de la linealización con mejor R²
              linearizations:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    id:
                      type: integer
                    status:
                      type: string
                      enum: [OK, ERROR]
                    slope:
                      type: number
                    intercept:
                      type: number
                    statistics:
                      type: object
                      properties:
                        r_squared:
                          type: number
                    transformed:
                      type: object
                      properties:
                        x:
                          type: array
                          items:
                            type: number
                        y:
                          type: array
                          items:
                            type: number
                    parameters:
                      type: array
                      items:
                        $ref: '#/components/schemas/FittedParameter'
                    assumed_params:
                      type: object
                      additionalProperties:
                        type: number
                      description: >
                        Parámetros que se dieron por conocidos para construir la
                        transformación, ya sea provistos en el request o estimados.
                        Sólo presente cuando `status` es `OK`.
                      example:
                        qe: 7.4
                    dropped_points:
                      type: integer
                      description: >
                        Cantidad de puntos experimentales descartados por no ser
                        transformables (e.g. `t=0` en PSO, o `qt = qe` en PFO).
                        Sólo presente cuando `status` es `OK`.
                    reason:
                      type: string
                      description: Motivo del fallo. Sólo presente cuando `status` es `ERROR`.

    KineticRunNoLinearRequest:
      type: object
      required:
        - kinetic_sample_id
        - models
      properties:
        kinetic_sample_id:
          type: integer
        models:
          type: array
          items:
            type: object
            required: [model, seeds]
            properties:
              model:
                type: integer
                description: ID del modelo cinético
              seeds:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: number
              iterations:
                type: integer
                default: 10000
              step:
                type: number
                nullable: true
        filter:
          type: array
          items:
            type: integer
          example: []

    KineticRunNoLinearResponse:
      type: object
      properties:
        kinetic_sample_id:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              model:
                type: integer
              best_adjust:
                type: string
                example: "leastsq"
              adjustment_methods:
                type: array
                items:
                  $ref: '#/components/schemas/KineticFittedMethod'
        comparison:
          type: object
          properties:
            heuristic:
              type: object
              nullable: true
              properties:
                best_model:
                  type: integer
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      model:
                        type: integer
                      score:
                        type: number
            ml:
              type: object
              nullable: true
              description: "Pendiente de implementación"

    KineticFittedMethod:
      type: object
      properties:
        name:
          type: string
          example: "leastsq"
        success:
          type: boolean
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/FittedParameter'
        statistics:
          $ref: '#/components/schemas/Statistics'
        residuals:
          type: object
          properties:
            values:
              type: array
              items:
                type: number
            analysis:
              $ref: '#/components/schemas/ResidualsAnalysis'
        transformed:
          type: object
          description: Curva extendida de 300 puntos para graficar
          properties:
            x:
              type: array
              items:
                type: number
              description: Valores de tiempo extendidos
            y:
              type: array
              items:
                type: number
              description: Valores de qt predichos

    KineticSaveRequest:
      type: object
      required:
        - kinetic_sample_id
      properties:
        kinetic_sample_id:
          type: integer
          description: ID of the kinetic sample
        kinetic_investigation_id:
          type: integer
          nullable: true
          description: ID of existing investigation (null to create new)
        results:
          type: array
          description: Array of fitted models from run-no-linear-model response (optional, defaults to [])
          items:
            type: object
            properties:
              model:
                type: integer
              best_adjust:
                type: string
              seeds:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: number
              adjustment_methods:
                type: array
                items:
                  $ref: '#/components/schemas/KineticFittedMethod'
        comparison:
          type: object
          description: Comparison result from run-no-linear-model response (optional, defaults to {})
          nullable: true
          properties:
            heuristic:
              type: object
              nullable: true
            ml:
              type: object
              nullable: true
        iterations:
          type: integer
          nullable: true
          description: Number of iterations used in fitting (optional)
        steps:
          type: number
          nullable: true
          description: Step size used in fitting (optional)

    KineticGetInvestigationsResponse:
      type: object
      properties:
        investigations:
          type: array
          items:
            $ref: '#/components/schemas/KineticInvestigation'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    KineticInvestigation:
      type: object
      properties:
        kinetic_investigation_id:
          type: integer
        kinetic_sample_id:
          type: integer
        sample:
          $ref: '#/components/schemas/KineticSample'
        user_id:
          type: integer
        user:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            email:
              type: string

    KineticVersion:
      type: object
      properties:
        version_id:
          type: integer
        kinetic_investigation_id:
          type: integer
        iterations:
          type: integer
          nullable: true
        steps:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        fitted_models:
          type: array
          items:
            type: object
            properties:
              kinetic_fitted_model_id:
                type: integer
              kinetic_model_id:
                type: integer
              best_adjust:
                type: string
              seeds:
                type: array
                items:
                  $ref: '#/components/schemas/FittedParameter'
              adjustment_methods:
                type: array
                items:
                  $ref: '#/components/schemas/KineticFittedMethod'
        comparison:
          type: object
          nullable: true

    FittedParameter:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
        std_err:
          type: number
          nullable: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT