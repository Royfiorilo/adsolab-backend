openapi: 3.0.3
info:
  title: AdsoLab API
  version: 2.0.0
  description: |
    API del backend de AdsoLab. Permite modelar el equilibrio de adsorción
    (módulo de isotermas) y la cinética de adsorción (módulo cinético).

    ## Autenticación
    Los endpoints marcados con 🔒 requieren un Bearer token obtenido desde `POST /auth-token`.
    
    **Método recomendado (Producción):**
    ```
    Authorization: Bearer <token>
    ```
    
    **Método alternativo (Solo para testing local):**
    ```
    ?auth_token=<token>
    ```
    
    ⚠️ **ADVERTENCIA DE SEGURIDAD:** El método de query parameter (`?auth_token=`) 
    NO es seguro para producción. El token queda expuesto en:
    - Logs del servidor web (Nginx, Apache, etc.)
    - Historial del navegador
    - Headers Referer al visitar sitios externos
    - Proxies corporativos y firewalls
    
    **Siempre usa Bearer token en el header `Authorization` para integraciones reales.**

    ## Módulos
    - **Equilibrio (isotermas):** `/sample`, `/samples`, `/models`, `/investigation/*`, `/investigations`
    - **Cinética:** `/kinetics/*`
    - **Materiales:** `/adsorbates`, `/adsorbents`, `/adsorption-materials`
    - **Usuarios:** `/users`

servers:
  - url: http://127.0.0.1:5000
    description: Local development server
  - url: https://api.adsolab.xyz
    description: Production server

tags:
  - name: Autenticación
    description: Obtención de token JWT
  - name: Usuarios
    description: Gestión de usuarios y roles
  - name: Materiales
    description: Adsorbatos y adsorbentes disponibles
  - name: "Equilibrio - Muestras"
    description: Muestras de isotermas (ce/qe)
  - name: "Equilibrio - Modelos"
    description: Modelos de isotermas y métodos de optimización
  - name: "Equilibrio - Investigaciones"
    description: Flujo de análisis de isotermas (linealización, ajuste no lineal, histórico)
  - name: "Cinética - Modelos"
    description: Modelos cinéticos disponibles
  - name: "Cinética - Muestras"
    description: Muestras cinéticas (time/qt)
  - name: "Cinética - Análisis"
    description: Seeds, linealización y ajuste no lineal cinético
  - name: "Cinética - Investigaciones"
    description: Guardar y recuperar resultados cinéticos

paths:

  /health-check:
    get:
      tags:
        - Autenticación
      summary: Health check
      description: Verifica que el servidor está corriendo.
      responses:
        '200':
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # Authentication
  /auth-token:
    post:
      tags:
        - Autenticación
      summary: Obtain authentication token
      description: |
        Authenticates a user and returns a token valid for 24 hours.
        
        **Uso del token:**
        - ✅ **Recomendado:** `Authorization: Bearer <token>` (seguro, no se loguea)
        - ⚠️ **Solo testing:** `?auth_token=<token>` (inseguro, se expone en logs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email:
                  type: string
                  format: email
                  example: adsolab@dev.com
                password:
                  type: string
                  format: password
                  example: password
      responses:
        '200':
          description: Token obtained successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer token válido por 24 horas
                  user_id:
                    type: integer
                  email:
                    type: string
              examples:
                success:
                  summary: Autenticación exitosa
                  value:
                    token: ".eJwNykEKgCAQBdC7zFrCEf06XibUHGgnRRFEd8_dW7yX7n5Qp..."
                    user_id: 1
                    email: "adsolab@dev.com"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                invalid:
                  summary: Credenciales inválidas
                  value:
                    error: "Invalid email or password"

  # Users
  /users:
    post:
      tags:
        - Usuarios
      summary: Crear usuario
      description: Creates a new user account. Only accessible by users with ADMIN or DEV roles.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: mysecurepassword
                role:
                  type: string
                  description: Optional user role. Defaults to RESEARCHER if not specified.
                  example: RESEARCHER
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (missing fields or invalid format)
        '409':
          description: Conflict (email already taken)

    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: Retrieves a paginated list of users. Only accessible by ADMIN or DEV roles.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
          description: Number of users per page (maximum 100)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  pages:
                    type: integer

  /users/{user_id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario
      description: Get details of a specific user. Only the user themselves or an ADMIN can access.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden (unauthorized access)
        '404':
          description: User not found

    put:
      tags:
        - Usuarios
      summary: Actualizar usuario
      description: Updates email, password, role, or active status. Restrictions apply depending on the user's role.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [ ADMIN, RESEARCHER ]
                active:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '403':
          description: Forbidden (no permission to update)
        '404':
          description: User not found
        '409':
          description: Conflict (email already taken)

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      description: Soft deletes a user. Cannot delete your own account. Only ADMIN or DEV can delete.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Bad request (cannot delete own account)
        '404':
          description: User not found

  # Materials
  /adsorbates:
    get:
      tags:
        - Materiales
      summary: List all adsorbates
      description: Retrieves a list of all available adsorbates.
      responses:
        '200':
          description: List of adsorbates retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adsorbates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adsorbate'
        '404':
          description: No adsorbates found.

  /adsorbents:
    get:
      tags:
        - Materiales
      summary: List all adsorbents
      description: Retrieves a list of all available adsorbents.
      responses:
        '200':
          description: List of adsorbents retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adsorbents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adsorbent'
        '404':
          description: No adsorbents found.

  /materials_sync:
    get:
      tags:
        - Materiales
      summary: Synchronize materials
      description: Synchronizes adsorbates and adsorbents data with external sources.
      responses:
        '200':
          description: Materials synchronized successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Materials synchronized
                  status:
                    type: string
                    example: OK
        '400':
          description: Validation error during synchronization.

  /adsorption-materials:
    get:
      tags:
        - Materiales
      summary: Retrieve adsorbates and adsorbents
      description: Retrieves both adsorbates and adsorbents in a single response.
      responses:
        '200':
          description: List of adsorbates and adsorbents retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adsorbates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adsorbate'
                  adsorbents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adsorbent'

  # Samples
  /samples:
    get:
      tags:
        - "Equilibrio - Muestras"
      summary: List all samples
      description: Retrieves all existing samples.
      responses:
        '200':
          description: List of samples retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sample'
        '404':
          description: No samples found

  /sample:
    post:
      tags:
        - "Equilibrio - Muestras"
      summary: Create a new sample
      description: Creates a new sample associated with the authenticated user.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleInput'
      responses:
        '201':
          description: Sample created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '400':
          description: Validation error

  /sample/{sample_id}:
    get:
      tags:
        - "Equilibrio - Muestras"
      summary: Get a sample by ID
      description: Retrieves the details of a specific sample by its ID.
      parameters:
        - in: path
          name: sample_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sample details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '404':
          description: Sample not found

    delete:
      tags:
        - "Equilibrio - Muestras"
      summary: Eliminar muestra de equilibrio
      description: Soft deletes a sample owned by the authenticated user.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: sample_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sample deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  sample_id:
                    type: integer
        '403':
          description: Forbidden (user not authorized to delete the sample)
        '404':
          description: Sample not found

  # Models
  /models:
    get:
      tags:
        - "Equilibrio - Modelos"
      summary: Listar modelos de isotermas
      description: Retrieves a list of available isotherm models.
      responses:
        '200':
          description: List of models retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
        '404':
          description: No models found

  /models/methods:
    get:
      tags:
        - "Equilibrio - Modelos"
      summary: Listar métodos de optimización
      description: Retrieves a list of available methods used to optimize model fitting.
      responses:
        '200':
          description: List of optimization methods retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/Method'
        '404':
          description: No adjust methods found

  # Investigations
  /investigation/run-linearization:
    post:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Run linearization models
      description: Executes linearization models for a given sample and model set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunLinearizationRequest'
      responses:
        '200':
          description: Linearization models executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLinearizationResponse'

  /investigation/run-no-linear-model:
    post:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Run non-linear models
      description: Executes non-linear optimization models for a sample.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunNoLinearModelRequest'
      responses:
        '200':
          description: Non-linear models executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunNoLinearModelResponse'

  /investigation/predict-seeds:
    post:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Predict initial seeds
      description: Predicts initial seeds for models based on sample data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictSeedsRequest'
      responses:
        '200':
          description: Seeds predicted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictSeedsResponse'

  /investigations:
    get:
      tags:
        - "Equilibrio - Investigaciones"
      summary: List investigations
      description: Retrieves a paginated list of investigations.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: per_page
          schema:
            type: integer
          description: Items per page
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by user ID
      responses:
        '200':
          description: List of investigations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvestigationsResponse'

  /investigation/save:
    post:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Save investigation and version
      description: |
        Creates or updates an investigation and its version.
        
        **Required fields:**
        - `sample_id`: ID of the sample
        - `results`: Array of fitted models (output from `/investigation/run-no-linear-model`)
        - `comparison`: Comparison object (output from `/investigation/run-no-linear-model`)
        
        **Optional fields:**
        - `investigation_id`: null to create new, or existing ID to add version
        - `iterations`: Number of iterations used
        - `steps`: Step size used
        
        **Typical workflow:**
        1. Run `/investigation/run-no-linear-model` to get results + comparison
        2. Call this endpoint with those results to save them
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveInvestigationRequest'
      responses:
        '201':
          description: Investigation and version saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveInvestigationResponse'

  /investigation/{investigation_id}/version/{version_id}:
    get:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Get a specific version
      description: Retrieves a specific version of an investigation.
      parameters:
        - in: path
          name: investigation_id
          required: true
          schema:
            type: integer
        - in: path
          name: version_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Investigation version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'

    delete:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Eliminar versión
      description: Deletes a specific version of an investigation.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: investigation_id
          required: true
          schema:
            type: integer
        - in: path
          name: version_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Version deleted successfully

  /investigation/{investigation_id}/versions:
    get:
      tags:
        - "Equilibrio - Investigaciones"
      summary: List versions of an investigation
      description: Retrieves all versions related to an investigation.
      parameters:
        - in: path
          name: investigation_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvestigationVersionsResponse'

  /investigation/{investigation_id}:
    delete:
      tags:
        - "Equilibrio - Investigaciones"
      summary: Eliminar una investigación
      description: Elimina una investigación y todas sus versiones en cascada. Solo el propietario puede eliminarla.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: investigation_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Investigación eliminada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  investigation_id:
                    type: integer
        '403':
          description: No autorizado
        '404':
          description: Investigación no encontrada

  # ─────────────────────────────────────────────
  # MÓDULO CINÉTICO
  # ─────────────────────────────────────────────

  /kinetics/models:
    get:
      tags:
        - Cinética - Modelos
      summary: Listar modelos cinéticos
      description: |
        Devuelve todos los modelos cinéticos disponibles en base de datos.
        
        **Modelos implementados:**
        - **Difusión Intraparticular (Weber-Morris)** - Modelo de difusión en poros
        - **Pseudo-Primer Orden (Lagergren, PFO)** - Cinética de primer orden
        - **Pseudo-Segundo Orden (Ho & McKay, PSO)** - Cinética de segundo orden (quimisorción)
      responses:
        '200':
          description: Lista de modelos cinéticos
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/KineticModel'
              example:
                models:
                  - _id: 1
                    name: "Difusión Intraparticular"
                    formula: "qt = kid * time**0.5 + C"
                    latex_formula: "q_t = k_{id} \\cdot \\sqrt{t} + C"
                    description: "Modelo de Weber-Morris..."
                    parameters:
                      kid: "constante de velocidad de difusión intraparticular (mg/g·min^0.5)"
                      C: "intercepto relacionado con la capa límite externa (mg/g)"
                    linearizations:
                      - linearization_id: 1
                        name: "Linealización Intraparticular"
                        formula: "qt = kid * time**0.5 + C"
                        parameters:
                          x: "time**0.5"
                          y: "qt"
                          m: "kid"
                          b: "C"

  /kinetics/samples:
    get:
      tags:
        - Cinética - Muestras
      summary: Listar muestras cinéticas
      description: Devuelve todas las muestras cinéticas activas (no eliminadas).
      responses:
        '200':
          description: Lista de muestras cinéticas
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      $ref: '#/components/schemas/KineticSample'
        '404':
          description: No se encontraron muestras

  /kinetics/sample:
    post:
      tags:
        - Cinética - Muestras
      summary: Crear muestra cinética 🔒
      description: |
        Crea una nueva muestra cinética asociada al usuario autenticado.

        **Opciones de entrada:**
        - **Opción A:** Proveer `time` + `qt` directamente.
        - **Opción B:** Proveer `time` + `concentration` con `initial_concentration`, `volume`
          y `adsorbent_mass`. El backend calcula `qt = (C0 - Ct) * V / m`.

        Los datos se ordenan automáticamente por tiempo antes de persistir.
        El título se genera automáticamente si no se provee: `{user}-{temp}K-cinetica-{adsorbato}-{adsorbente}-{fecha}`.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KineticSampleInput'
            examples:
              con_qt:
                summary: Con qt directo
                value:
                  time: [0, 5, 10, 20, 30, 60]
                  qt: [0.0, 3.2, 5.1, 6.8, 7.4, 7.8]
                  temperature: 298
                  time_unit: "min"
                  measure_unit: "mg/g"
                  adsorbate_id: 1
                  adsorbent_id: 1
              con_concentracion:
                summary: Con concentración (el backend calcula qt)
                value:
                  time: [0, 5, 10, 20, 30]
                  concentration: [50.0, 43.6, 38.4, 33.2, 30.1]
                  initial_concentration: 50.0
                  volume: 0.25
                  adsorbent_mass: 0.5
                  temperature: 298
                  time_unit: "min"
                  measure_unit: "mg/g"
                  adsorbate_id: 1
                  adsorbent_id: 1
      responses:
        '201':
          description: Muestra cinética creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticSample'
        '400':
          description: Error de validación (longitudes distintas, valores negativos, faltan campos requeridos)
        '401':
          description: No autenticado

  /kinetics/sample/{kinetic_sample_id}:
    get:
      tags:
        - Cinética - Muestras
      summary: Obtener muestra cinética por ID
      parameters:
        - in: path
          name: kinetic_sample_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos completos de la muestra cinética
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticSample'
        '404':
          description: Muestra no encontrada

    delete:
      tags:
        - Cinética - Muestras
      summary: Eliminar muestra cinética 🔒
      description: Soft-delete de una muestra cinética. Solo el propietario puede eliminarla.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: kinetic_sample_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Muestra eliminada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinetic_sample_id:
                    type: integer
        '403':
          description: No autorizado
        '404':
          description: Muestra no encontrada

  /kinetics/predict-seeds:
    post:
      tags:
        - Cinética - Análisis
      summary: Predecir semillas iniciales
      description: |
        Estima los parámetros iniciales (seeds) para los modelos cinéticos seleccionados.
        Necesario antes de ejecutar el ajuste no lineal.

        **Estrategia de seeds:**
        - `qe` → `max(qt)`
        - `kid` → `max(qt) / sqrt(max(time))`
        - `k1` → `0.1`
        - `k2` → `0.01`
        - otros → `1.0`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KineticPredictSeedsRequest'
            example:
              kinetic_sample_id: 1
              models:
                - model: 1
              filter: []
      responses:
        '200':
          description: Seeds predichas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticPredictSeedsResponse'
              example:
                kinetic_sample_id: 1
                results:
                  - id: 1
                    name: "Difusión Intraparticular"
                    seeds:
                      - name: "kid"
                        value: 0.834
                      - name: "C"
                        value: 1.0
        '400':
          description: Faltan campos requeridos
        '404':
          description: Muestra no encontrada

  /kinetics/run-linearization:
    post:
      tags:
        - Cinética - Análisis
      summary: Ejecutar linealización cinética
      description: |
        Ejecuta las linealizaciones de los modelos cinéticos seleccionados.

        En todos los casos: se transforman los puntos, se ajusta una regresión lineal
        `y = m·x + b`, se despejan los parámetros resolviendo el sistema con SymPy y se
        propagan las incertidumbres mediante Jacobiano.

        **Difusión Intraparticular (Weber-Morris):**
        - Transforma: `x = √t`, `y = qt`
        - Recupera: `kid = m`, `C = b`

        **Pseudo-Segundo Orden (Ho y McKay):**
        - Transforma: `x = t`, `y = t/qt`
        - Recupera: `qe = 1/m`, `k2 = 1/(b·qe²)`
        - El punto `t = 0` no es transformable y se descarta.

        **Pseudo-Primer Orden (Lagergren):**
        - Transforma: `x = t`, `y = ln(qe - qt)`
        - Recupera: `k1 = -m`, `qe = e^b`
        - Esta transformación necesita conocer `qe` de antemano, que es a la vez uno de
          los parámetros a despejar. Se toma de `known_params.qe` si viene en el request;
          si no, se estima como `max(qt)`. El valor efectivamente usado se devuelve en
          `assumed_params`.
        - **Limitación:** si la muestra no alcanzó el equilibrio, `max(qt)` subestima `qe`
          y la linealización pierde precisión. Conviene enviar `qe` explícito cuando se
          lo conoce.

        Los puntos que no se pueden transformar (división por cero, logaritmo de un valor
        no positivo) se descartan; la cantidad se informa en `dropped_points`. Si quedan
        menos de 2 puntos válidos, esa linealización devuelve `status: ERROR` con el motivo,
        sin abortar el resto de la respuesta.

        Devuelve los datos transformados listos para graficar en Plotly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KineticRunLinearizationRequest'
            example:
              kinetic_sample_id: 1
              models:
                - model: 1
                  linearizations: [1]
              filter: []
      responses:
        '200':
          description: Linealización ejecutada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticRunLinearizationResponse'
              example:
                kinetic_sample_id: 1
                results:
                  - model: 1
                    best_result: 1
                    linearizations:
                      - name: "Linealización Intraparticular"
                        id: 1
                        status: "OK"
                        slope: 0.834
                        intercept: 0.21
                        statistics:
                          r_squared: 0.9912
                        transformed:
                          x: [0.0, 2.236, 3.162, 4.472, 5.477, 7.746]
                          y: [0.0, 3.2, 5.1, 6.8, 7.4, 7.8]
                        parameters:
                          - name: "kid"
                            value: 0.834
                            std_err: 0.021
                          - name: "C"
                            value: 0.21
                            std_err: 0.11
        '400':
          description: Faltan campos requeridos
        '404':
          description: Muestra no encontrada

  /kinetics/run-no-linear-model:
    post:
      tags:
        - Cinética - Análisis
      summary: Ejecutar ajuste no lineal cinético
      description: |
        Endpoint principal del módulo cinético. Ejecuta el ajuste no lineal de uno o
        varios modelos cinéticos usando `time` como variable independiente y `qt` como
        variable dependiente.

        **Flujo interno:**
        1. Recupera la muestra cinética (aplica filtro si se indica).
        2. Para cada modelo: corre todos los métodos de optimización disponibles
           (Nelder-Mead, Levenberg-Marquardt, Powell, etc.).
        3. Selecciona el mejor método por estadísticas.
        4. Calcula R², R²adj, RMSE, SSE, AIC, BIC, χ², análisis de residuos.
        5. Genera curva extendida de 300 puntos lista para Plotly.
        6. Compara modelos entre sí (heurística por score ponderado).

        **Bounds automáticos:**
        - Parámetros tipo `q`: `[0.001, max(qt) × 1.1]`
        - Otros parámetros: `[0, ∞)`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KineticRunNoLinearRequest'
            example:
              kinetic_sample_id: 1
              models:
                - model: 1
                  seeds:
                    - name: "kid"
                      value: 0.834
                    - name: "C"
                      value: 1.0
                  iterations: 10000
                  step: 0.1
              filter: []
      responses:
        '200':
          description: Ajuste ejecutado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KineticRunNoLinearResponse'
              example:
                kinetic_sample_id: 1
                results:
                  - model: 1
                    best_adjust: "leastsq"
                    adjustment_methods:
                      - name: "leastsq"
                        success: true
                        parameters:
                          - name: "kid"
                            value: 0.821
                            std_err: 0.018
                          - name: "C"
                            value: 0.24
                            std_err: 0.09
                        statistics:
                          r_squared: 0.9934
                          adjust_r_squared: 0.9921
                          RMSE: 0.089
                          SSE: 0.047
                          AIC: -31.2
                          BIC: -30.4
                          chi_squared: 0.012
                        residuals:
                          values: [0.01, -0.05, 0.03, -0.02, 0.04, -0.01]
                          analysis:
                            passes_normality: true
                            normality_pvalue: 0.312
                            passes_homoscedasticity: true
                            homoscedasticity_pvalue: 0.541
                            passes_independence: true
                            durbin_watson: 1.97
                        transformed:
                          x: [0.0, 1.2, 2.5, 3.8, 5.1, 6.4]
                          y: [0.0, 3.18, 5.13, 6.77, 7.41, 7.79]
                comparison:
                  heuristic:
                    best_model: 1
                    results:
                      - model: 1
                        score: 0.874
        '400':
          description: Faltan campos requeridos
        '404':
          description: Muestra no encontrada

